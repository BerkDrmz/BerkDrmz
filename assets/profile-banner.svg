<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title description">
  <title id="title">Berk Durmaz</title>
  <desc id="description">A warm, dark cover with large cream typography and a copper audio waveform inside a floating display.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="918" height="408" rx="25"/></clipPath>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#151312"/>
      <stop offset="1" stop-color="#211714"/>
    </linearGradient>
    <radialGradient id="light" cx="75%" cy="43%" r="48%">
      <stop stop-color="#843f22" stop-opacity=".55"/>
      <stop offset="1" stop-color="#843f22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="517" y1="278" x2="842" y2="108">
      <stop stop-color="#b56c45" stop-opacity=".18"/>
      <stop offset=".6" stop-color="#f39460" stop-opacity=".68"/>
      <stop offset="1" stop-color="#fbc19c" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="signal" gradientUnits="userSpaceOnUse" x1="592" y1="198" x2="780" y2="198">
      <stop stop-color="#a54e2a"/>
      <stop offset=".48" stop-color="#ffc59d"/>
      <stop offset="1" stop-color="#e8834f"/>
    </linearGradient>
    <linearGradient id="display" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#33211a"/>
      <stop offset="1" stop-color="#161210"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0v20" fill="none" stroke="#edb79a" stroke-opacity=".10"/>
    </pattern>
    <linearGradient id="grid-fade" gradientUnits="userSpaceOnUse" x1="460" x2="900">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".6" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity=".35"/>
    </linearGradient>
    <mask id="grid-mask"><rect x="450" width="470" height="410" fill="url(#grid-fade)"/></mask>
    <filter id="shadow" x="-20%" y="-80%" width="140%" height="260%">
      <feDropShadow dx="0" dy="16" stdDeviation="17" flood-color="#0d0908" flood-opacity=".68"/>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .name { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 750; }
    .signal-sweep { opacity: 0; filter: brightness(1.65); }
    @media (prefers-reduced-motion: no-preference) {
      .instrument { animation: settle 1.45s cubic-bezier(.18,.72,.2,1) both; }
      .signal-sweep { animation: sweep 1.65s .55s ease-in-out both; }
    }
    @keyframes settle {
      from { transform: translateY(11px); opacity: .7; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes sweep {
      0% { stroke-dashoffset: 1; opacity: 0; }
      22% { opacity: 1; }
      75% { opacity: .92; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="920" height="410" fill="url(#background)"/>
    <rect width="920" height="410" fill="url(#light)"/>
    <rect x="460" width="460" height="410" fill="url(#grid)" mask="url(#grid-mask)"/>

    <g fill="none" stroke="url(#wire)" stroke-width="1.15" transform="rotate(-19 689 198)">
      <ellipse cx="689" cy="198" rx="115" ry="58"/>
      <ellipse cx="689" cy="198" rx="132" ry="71"/>
      <ellipse cx="689" cy="198" rx="149" ry="84"/>
      <ellipse cx="689" cy="198" rx="166" ry="97"/>
      <ellipse cx="689" cy="198" rx="183" ry="110"/>
    </g>
    <g stroke="#ef9a67" stroke-width="1" opacity=".55">
      <path d="M530 108h14m-7-7v14m286 169h14m-7-7v14"/>
      <circle cx="797" cy="89" r="3" fill="#ef9a67"/>
      <circle cx="576" cy="293" r="3" fill="#ef9a67"/>
    </g>

    <g class="instrument">
      <rect x="560" y="155" width="258" height="88" rx="44" fill="url(#display)" stroke="#a6694b" stroke-opacity=".72" filter="url(#shadow)"/>
      <path d="M582 199h214" stroke="#e9a680" stroke-opacity=".16" stroke-dasharray="2 5"/>
      <path id="waveform" d="M588 199h17l8-7 8 15 10-27 11 39 11-51 12 58 12-44 12 28 11-20 11 14 10-10 10 7h37" fill="none" stroke="url(#signal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
      <use class="signal-sweep" href="#waveform" style="stroke-dasharray: .24 1; stroke-dashoffset: 1"/>
      <circle cx="794" cy="199" r="3.5" fill="#ffc59d"/>
    </g>

    <path d="M48 342h824" stroke="#b58b74" stroke-opacity=".42"/>
    <text class="mono" x="49" y="65" fill="#f3aa7e" font-size="18" letter-spacing="2.6">@BERKDRMZ</text>
    <text class="name" x="44" y="185" fill="#fff1e5" font-size="115" letter-spacing="-6">Berk</text>
    <text class="name" x="43" y="289" fill="#fff1e5" font-size="115" letter-spacing="-6">Durmaz<tspan fill="#f3aa7e">.</tspan></text>
    <text class="mono" x="49" y="377" fill="#f7d8c6" font-size="22" letter-spacing="1">macOS / Swift</text>
    <text class="mono" x="872" y="377" text-anchor="end" fill="#f7d8c6" font-size="22" letter-spacing="1">Web / Unity</text>
  </g>
  <rect x="1" y="1" width="918" height="408" rx="25" fill="none" stroke="#805b4a" stroke-width="2"/>
</svg>
